name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # AGP downloads missing SDK platforms itself once the licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Unit tests, detekt, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest detekt lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: supernova-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            **/build/reports/
            **/build/test-results/

      # No keystore in CI. app/build.gradle.kts leaves release unsigned when
      # local/keystore.properties is absent, so R8 and resource shrinking run
      # here without signing secrets.
      - name: Release build
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
