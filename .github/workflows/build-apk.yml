name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [ccr-c6390468-djw86f]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Create a self-signed key for sideloading
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.keystore" -alias supernova \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass supernova-ci -keypass supernova-ci \
            -dname "CN=Supernova CI"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/ci.keystore
          storePassword=supernova-ci
          keyAlias=supernova
          keyPassword=supernova-ci
          EOF
          sed -i 's/^ *//' keystore.properties
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: supernova-release-apk
          path: app/build/outputs/apk/release/*.apk
